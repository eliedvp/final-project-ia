<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VibeTunes – Lecteur musical</title>
  <style>
    :root{
      --bg:#0b0f14;              /* fond sombre */
      --panel:#111826;           /* panneau */
      --muted:#9aa4b2;           /* texte secondaire */
      --text:#e6edf3;            /* texte principal */
      --accent: #6ea8ff;         /* bouton accent (bleu) */
      --accent-2: #f472b6;       /* bouton accent (rose) */
      --radius: 20px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji";
      color:var(--text); background:
      radial-gradient(1200px 1200px at 10% -10%, rgba(110,168,255,.12), transparent 60%),
      radial-gradient(1000px 800px at 90% -10%, rgba(244,114,182,.10), transparent 60%),
      linear-gradient(180deg, #0b0f14 0%, #0b0f14 100%);
    }
    .container{max-width:1100px; margin:0 auto; padding:24px}

    /* Header */
    header{display:flex; gap:12px; align-items:center; justify-content:space-between; margin-bottom:12px}
    #appTitle{font-size:clamp(22px, 2.4vw, 32px); font-weight:800; letter-spacing:.5px}
    .search{display:flex; align-items:center; gap:10px; width:min(560px, 100%)}
    .search input{flex:1; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.08); padding:12px 14px; border-radius:12px; color:var(--text); outline:none}
    .search button{padding:12px 16px; border:none; border-radius:12px; color:#081019; background:linear-gradient(135deg, var(--accent), var(--accent-2)); font-weight:700; cursor:pointer}

    /* Status */
    #statusMsg{margin:10px 0 18px; padding:10px 12px; border-radius:12px; background:rgba(255,255,255,.02); color:var(--muted); border:1px solid rgba(255,255,255,.03)}
    #statusMsg.error{border-color:rgba(244,114,182,.28); color:#fbb6ce}

    /* Player card */
    .player{display:grid; grid-template-columns: 300px 1fr; gap:22px; background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.06); padding:18px; border-radius:var(--radius); box-shadow: 0 8px 30px rgba(0,0,0,.35)}
    .coverWrap{position:relative; aspect-ratio:1/1; border-radius:16px; overflow:hidden; background:#0f1622}
    .coverWrap img{width:100%; height:100%; object-fit:cover}
    .now{display:flex; flex-direction:column; gap:10px}
    .title{font-size:clamp(18px, 2.2vw, 26px); font-weight:800}
    .artist{color:var(--muted)}
    .controls{display:flex; align-items:center; gap:10px; margin-top:8px}
    .btn{appearance:none; border:none; cursor:pointer; color:#081019; font-weight:800; padding:12px 16px; border-radius:14px; transition:transform .12s ease}
    .btn:active{transform:scale(.98)}
    .btn.play{background:linear-gradient(135deg, var(--accent), #9ed0ff)}
    .btn.pause{background:linear-gradient(135deg, var(--accent-2), #fecdd3)}
    .btn.next{background:linear-gradient(135deg, #a78bfa, #60a5fa)}

    .progressBar{width:100%; height:10px; background:rgba(255,255,255,.08); border-radius:999px; overflow:hidden; margin-top:10px; cursor:pointer}
    .progressFill{height:100%; width:0%; background:linear-gradient(90deg, var(--accent), var(--accent-2));}
    .timeRow{display:flex; justify-content:space-between; color:var(--muted); font-size:12px; margin-top:6px}

    /* Top tracks */
    .sectionTitle{margin:18px 0 10px; font-weight:800; letter-spacing:.3px}
    .scroller{display:flex; gap:14px; overflow-x:auto; padding-bottom:6px; scrollbar-width:thin; scroll-snap-type:x mandatory}
    .card{min-width:150px; max-width:150px; scroll-snap-align:start; background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.06); border-radius:16px; padding:10px; text-align:left}
    .card img{width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:12px}
    .card .t{font-weight:700; margin-top:8px; font-size:14px}
    .card .a{color:var(--muted); font-size:12px}

    /* Controls row */
    .tools{display:flex; gap:10px; margin:12px 0}
    .secondary{background:rgba(255,255,255,.03); color:var(--text); border:1px solid rgba(255,255,255,.04); padding:8px 12px; border-radius:10px; cursor:pointer}

    /* Tests area */
    #testResults{margin-top:12px; font-family:monospace; color:var(--muted); white-space:pre-wrap}

    /* Responsive */
    @media (max-width: 800px){
      .player{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header>
      <div id="appTitle">VibeTunes</div>
      <div class="search">
        <input id="searchInput" type="search" placeholder="Rechercher un genre ou un artiste (ex: BOOBA, pop, rock)" />
        <button id="searchBtn">Rechercher</button>
      </div>
    </header>

    <div id="statusMsg">Statut : prêt. Charge automatique : <strong>BOOBA</strong>.</div>

    <div class="tools">
      <button id="useSample" class="secondary">Utiliser pistes d'exemple (local)</button>
      <button id="runTests" class="secondary">Lancer auto-tests</button>
      <div style="flex:1"></div>
      <button id="docsProxy" class="secondary">Souhaitez-vous un proxy serveur ?</button>
    </div>

    <!-- Player -->
    <section class="player" id="player">
      <div class="coverWrap">
        <img id="currentCover" alt="Pochette">
      </div>
      <div class="now">
        <div class="title" id="currentTitle">Titre</div>
        <div class="artist" id="currentArtist">Artiste</div>
        <div class="controls">
          <button class="btn play" id="btnPlay">Lecture</button>
          <button class="btn pause" id="btnPause">Pause</button>
          <button class="btn next" id="btnNext">Suivant</button>
        </div>
        <div class="progressBar" id="progressBar" title="Cliquer pour chercher">
          <div class="progressFill" id="progressFill"></div>
        </div>
        <div class="timeRow"><span id="timeCurrent">0:00</span><span id="timeTotal">0:00</span></div>
      </div>
    </section>

    <!-- Top tracks scroller -->
    <h3 class="sectionTitle">Meilleurs titres</h3>
    <div class="scroller" id="topTracks" aria-label="Meilleurs titres"></div>

    <!-- Tests output -->
    <div id="testResults"></div>
  </div>

  <!-- Hidden audio element -->
  <audio id="audio" crossorigin="anonymous"></audio>

  <script>
   
    const $ = (id) => document.getElementById(id);
    const els = {
      cover: $("currentCover"),
      title: $("currentTitle"),
      artist: $("currentArtist"),
      btnPlay: $("btnPlay"),
      btnPause: $("btnPause"),
      btnNext: $("btnNext"),
      audio: $("audio"),
      progressBar: $("progressBar"),
      progressFill: $("progressFill"),
      timeCurrent: $("timeCurrent"),
      timeTotal: $("timeTotal"),
      top: $("topTracks"),
      searchInput: $("searchInput"),
      searchBtn: $("searchBtn"),
      status: $("statusMsg"),
      useSample: $("useSample"),
      runTests: $("runTests"),
      docsProxy: $("docsProxy"),
      testResults: $("testResults"),
    };

    els.audio.crossOrigin = 'anonymous';

    let queue = []; // {title, artist, preview, cover}
    let index = 0;

    const DIRECT_URL = q => `https://api.deezer.com/search?q=${encodeURIComponent(q)}`;
    const ALLORIGINS_URL = q => `https://api.allorigins.win/raw?url=${encodeURIComponent(DIRECT_URL(q))}`;

    // Sample tracks (fallback local) – tests & local development
    const SAMPLE_TRACKS = [
      { title: 'Sample — Chill 1', artist: 'Demo', preview: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3', cover: 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?auto=format&fit=crop&w=500&q=60' },
      { title: 'Sample — Chill 2', artist: 'Demo', preview: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3', cover: 'https://images.unsplash.com/photo-1507874457470-272b3c8d8ee2?auto=format&fit=crop&w=500&q=60' },
      { title: 'Sample — Chill 3', artist: 'Demo', preview: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3', cover: 'https://images.unsplash.com/photo-1508672019048-805c876b67e2?auto=format&fit=crop&w=500&q=60' },
      { title: 'Sample — Chill 4', artist: 'Demo', preview: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3', cover: 'https://images.unsplash.com/photo-1470229722913-7c0e2dbbafd3?auto=format&fit=crop&w=500&q=60' },
      { title: 'Sample — Chill 5', artist: 'Demo', preview: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3', cover: 'https://images.unsplash.com/photo-1492684223066-81342ee5ff30?auto=format&fit=crop&w=500&q=60' },
    ];

    function showStatus(msg, isError = false){
      els.status.textContent = 'Statut : ' + msg;
      if(isError) els.status.classList.add('error'); else els.status.classList.remove('error');
    }

    // JSONP fallback (script tag) – Deezer historically prend en charge JSONP via "output=jsonp&callback=..."
    function jsonpFetch(query, timeout = 8000){
      return new Promise((resolve, reject) => {
        const cbName = '__dzcb_' + Date.now() + '_' + Math.floor(Math.random()*10000);
        const url = `https://api.deezer.com/search?q=${encodeURIComponent(query)}&output=jsonp&callback=${cbName}`;
        let timer;
        window[cbName] = (data) => {
          clearTimeout(timer);
          resolve(data);
          cleanup();
        };
        function cleanup(){
          try{ delete window[cbName]; }catch(e){}
          const s = document.getElementById(cbName);
          if(s) s.remove();
        }
        const script = document.createElement('script');
        script.id = cbName;
        script.src = url;
        script.onerror = () => { clearTimeout(timer); cleanup(); reject(new Error('JSONP script load error')); };
        document.body.appendChild(script);
        timer = setTimeout(()=>{ cleanup(); reject(new Error('JSONP timeout')); }, timeout);
      });
    }

    // Try multiple strategies to fetch Deezer data
    async function fetchDeezer(query){
      showStatus(`Chargement des pistes pour "${query}"...`);

      // 1) Try direct fetch
      try{
        const res = await fetch(DIRECT_URL(query));
        if(res.ok){
          const data = await res.json();
          if(Array.isArray(data.data)){
            showStatus('Données récupérées depuis Deezer (direct).');
            return data.data;
          }
        }
      }catch(err){
        // ignore and try next fallback
        console.warn('Direct fetch failed:', err);
      }

      // 2) Try AllOrigins proxy
      try{
        const res = await fetch(ALLORIGINS_URL(query));
        if(res.ok){
          const data = await res.json();
          if(Array.isArray(data.data)){
            showStatus('Données récupérées via proxy AllOrigins.');
            return data.data;
          }
        }
      }catch(err){
        console.warn('AllOrigins fetch failed:', err);
      }

      // 3) Try JSONP
      try{
        const data = await jsonpFetch(query);
        if(data && Array.isArray(data.data)){
          showStatus('Données récupérées via JSONP.');
          return data.data;
        }
      }catch(err){
        console.warn('JSONP failed:', err);
      }

      // 4) All failed -> throw and let caller handle fallback
      throw new Error('Impossible de récupérer les données Deezer (CORS/API) après plusieurs tentatives.');
    }

    function mapTracks(tracks){
      return tracks.map(t => ({
        title: t.title,
        artist: t.artist?.name || 'Artiste inconnu',
        preview: t.preview, // URL MP3 30s
        cover: t.album?.cover_medium || t.album?.cover || (t.cover ? t.cover : ''),
      })).filter(t => !!t.preview);
    }

    function setCurrent(i){
      if(!queue.length) return;
      index = (i + queue.length) % queue.length;
      const cur = queue[index];
      els.title.textContent = cur.title;
      els.artist.textContent = cur.artist;
      els.cover.src = cur.cover || '';
      els.audio.src = cur.preview; // URL
      els.audio.play().catch(()=>{});
      syncTimeLabels();
      highlightActiveCard();
    }

    function highlightActiveCard(){
      [...els.top.children].forEach((card, i)=>{
        card.style.outline = i === index ? '2px solid var(--accent)' : '1px solid rgba(255,255,255,.06)';
      })
    }

    function formatTime(sec){
      if(isNaN(sec)) return '0:00';
      const m = Math.floor(sec/60);
      const s = Math.floor(sec%60).toString().padStart(2,'0');
      return `${m}:${s}`;
    }

    function syncTimeLabels(){
      const a = els.audio;
      els.timeCurrent.textContent = formatTime(a.currentTime||0);
      els.timeTotal.textContent = formatTime(a.duration||30);
    }

    function updateProgress(){
      const a = els.audio;
      const p = a.duration ? (a.currentTime / a.duration) * 100 : (a.currentTime / 30) * 100; // 30s fallback
      els.progressFill.style.width = Math.min(100, p)+'%';
      syncTimeLabels();
    }

    // Progress bar seek
    els.progressBar.addEventListener('click', (e)=>{
      const rect = els.progressBar.getBoundingClientRect();
      const ratio = (e.clientX - rect.left) / rect.width;
      const dur = els.audio.duration || 30;
      els.audio.currentTime = Math.max(0, Math.min(dur * ratio, dur - .25));
    });

    // Controls
    els.btnPlay.addEventListener('click', ()=> els.audio.play());
    els.btnPause.addEventListener('click', ()=> els.audio.pause());
    els.btnNext.addEventListener('click', ()=> setCurrent(index+1));

    // Keyboard controls
    document.addEventListener('keydown', (e)=>{
      if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) return;
      if(e.code === 'Space'){ e.preventDefault(); els.audio.paused ? els.audio.play() : els.audio.pause(); }
      if(e.code === 'ArrowRight'){ setCurrent(index+1); }
      if(e.code === 'ArrowLeft'){ setCurrent(index-1); }
    });

    // Audio events
    els.audio.addEventListener('timeupdate', updateProgress);
    els.audio.addEventListener('loadedmetadata', syncTimeLabels);
    els.audio.addEventListener('ended', ()=> setCurrent(index+1));

    // Build Top Tracks UI
    function renderTop(){
      els.top.innerHTML = '';
      queue.forEach((t, i)=>{
        const card = document.createElement('button');
        card.className = 'card';
        card.setAttribute('aria-label', `${t.title} – ${t.artist}`);
        card.innerHTML = `\n          <img src="${t.cover}" alt="${t.title}">\n          <div class="t">${t.title}</div>\n          <div class="a">${t.artist}</div>\n        `;
        card.addEventListener('click', ()=> setCurrent(i));
        els.top.appendChild(card);
      });
      highlightActiveCard();
    }

    // Primary loader: use fetchDeezer with fallback to sample tracks
    async function load(query=''){
      els.searchInput.value = query;
      try{
        const raw = await fetchDeezer(query);
        const songs = mapTracks(raw);
        if(!songs.length) throw new Error('Aucun extrait disponible pour cette recherche');
        queue = songs.slice(0, 20); // limiter la file
        renderTop();
        setCurrent(0);
      }catch(err){
        console.error(err);
        showStatus('Échec de chargement Deezer (CORS/API). Chargement des pistes d\'exemple locales.', true);
        // fallback local
        queue = SAMPLE_TRACKS.slice();
        renderTop();
        setCurrent(0);
      }
    }

    // Test utilities – small automated tests as requested
    function runTests(){
      const results = [];
      // Test 1: mapTracks filters out items with no preview
      const raw = [
        { title:'A', artist:{name:'X'}, preview:'https://example.com/a.mp3', album:{cover_medium:'c1'} },
        { title:'B', artist:{name:'Y'}, preview:'', album:{cover_medium:'c2'} },
      ];
      const mapped = mapTracks(raw);
      results.push(`Test 1 - mapTracks filters previews: expected 1, got ${mapped.length}`);

      // Test 2: sample tracks available
      results.push(`Test 2 - SAMPLE_TRACKS count: expected >=1, got ${SAMPLE_TRACKS.length}`);

      // Test 3: JSONP helper exists (basic smoke test)
      results.push(`Test 3 - jsonpFetch function present: ${typeof jsonpFetch === 'function'}`);

      els.testResults.textContent = results.join('\n');
    }

    // UI actions
    els.searchBtn.addEventListener('click', ()=> load(els.searchInput.value.trim() || ''));
    els.searchInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') load(els.searchInput.value.trim()||'BOOBA'); });
    els.useSample.addEventListener('click', ()=>{
      showStatus('Chargement des pistes d\'exemple locales.');
      queue = SAMPLE_TRACKS.slice(); renderTop(); setCurrent(0);
    });
    els.runTests.addEventListener('click', runTests);
    els.docsProxy.addEventListener('click', ()=>{
      alert('Je peux générer un petit script Node/Express (proxy) que vous pouvez exécuter sur Replit ou un serveur pour contourner les problèmes CORS. Voulez-vous que je l\'ajoute ?');
    });

    // Auto-start
    load('BOOBA');
  </script>
</body>
</html>
